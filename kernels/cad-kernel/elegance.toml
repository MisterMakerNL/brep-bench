# The cases cad-kernel builds with a solution that stands out across the kernels, and what makes it so
# (SPEC.md, "An elegant implementation may be flagged").

"sweep/helical-pipe-round-ends" = "the ball itself is screwed along the helix, so the round ends come free"
"swept/ball-swung-groove" = "the kernel sweeps the ball itself; no torus and end balls assembled by hand"
