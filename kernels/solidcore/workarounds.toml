# The cases solidcore builds by working around a feature it lacks, and what that is
# (SPEC.md, "A workaround is flagged").

"chamfer/cube-all-edges" = "no chamfer corner cut flat"
"feature/hole-through-the-upper-arm" = "no hole through to the next face"
"feature/pad-down-to-cylinder" = "no extrusion up to a face"
"feature/post-up-to-dome" = "no extrusion up to a face"
"feature/rib-revolved-to-a-stop" = "no revolution up to a face"
"geometry/ellipsoid" = "no ellipsoid"
"geometry/ellipsoid-half" = "no ellipsoid"
"loft/slab-pinched-on-four-guides" = "no loft along guides"
"loft/square-spire-on-four-guides" = "no loft along guides"
"loft/square-to-octagon" = "no loft pairing a corner with a side"
"loft/square-to-round" = "no loft pairing a corner with an arc"
"loft/twisted-tapering-square" = "no loft along guides, no conical spiral"
"shell/box-open-top-outward" = "no outward shell with rounded walls"
"sweep/mitred-pipe-on-cube-edges" = "no mitred sweep along a path not in a plane"
"sweep/narrowing-bend" = "no sweep with a scaling law"
"sweep/round-cornered-pipe" = "no round corner on a sweep"
"swept/ball-along-spline-groove" = "no sweep of a solid along a curve"
"swept/ball-thread-groove" = "no sweep of a solid along a curve"
"swept/torus-slid-through-rod" = "no sweep of a torus"
"swept/two-beads-slid-through-rod" = "no sweep of a torus"
"thicken/angle-bracket-rounded" = "no rounded thickening"
"thicken/open-box-outward-rounded" = "no rounded thickening"
"thicken/sphere-skin" = "no closed sheet"
