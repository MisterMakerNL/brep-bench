# The cases solidcore builds by working around a feature it lacks, and what that is
# (SPEC.md, "A workaround is flagged").

"shell/box-open-top-outward" = "no outward shell with rounded walls"
"geometry/ellipsoid" = "no ellipsoid"
"geometry/ellipsoid-half" = "no ellipsoid"
"loft/slab-pinched-on-four-guides" = "no loft along guides"
"loft/square-spire-on-four-guides" = "no loft along guides"
"loft/square-to-octagon" = "no loft pairing a corner with a side"
"loft/square-to-round" = "no loft pairing a corner with an arc"
"loft/twisted-tapering-square" = "no loft along guides, no conical spiral"
