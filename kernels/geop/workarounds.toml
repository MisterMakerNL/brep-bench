# The cases geop builds by working around a feature it lacks, and what that is
# (SPEC.md, "A workaround is flagged"). geop has no primitive solids: every solid starts from a
# sketch, extruded, revolved, swept or lofted. A prism or a cylinder is an extrusion, the natural
# construction; a ball, a cone or a torus turned from its section is flagged, as for other kernels.

"boolean/napkin-ring" = "no sphere primitive"
"chamfer/cube-all-edges" = "no corner face for chamfers"
"chamfer/octahedron-all-edges" = "no corner face for chamfers"
"draft/boss-on-plate" = "no draft of non-planar faces"
"draft/cylinder-parted-both-ways" = "no draft of non-planar faces"
"draft/hole-tapered" = "no draft of non-planar faces"
"draft/rounded-box-sides" = "no draft of non-planar or tangent faces"
"draft/rounded-pocket-walls" = "no draft of non-planar or tangent faces"
"feature/post-up-to-dome" = "no sphere primitive"
"fillet/ball-and-post" = "no sphere primitive"
"loft/slab-pinched-on-four-guides" = "no loft on four guides"
"loft/twisted-tapering-square" = "no loft along guides"
"loft/twisted-thin-blade" = "no loft on four guides"
"primitives/cone-frustum" = "no cone primitive"
"primitives/sphere" = "no sphere primitive"
"primitives/torus" = "no torus primitive"
"sweep/helical-pipe-round-ends" = "no sweep of a solid, no sphere primitive"
"sweep/hollow-reducer" = "no loft through a profile with holes"
"sweep/narrowing-bend" = "no sweep of a hollow section whose loops scale apart"
"swept/ball-along-spline-groove" = "no sweep of a solid, no sphere primitive"
"swept/ball-swung-groove" = "no sweep of a solid, no sphere primitive"
"swept/ball-thread-groove" = "no sweep of a solid"
"swept/box-slid-aslant" = "no sweep of a solid"
"swept/torus-slid-through-rod" = "no sweep of a solid"
"swept/two-beads-slid-through-rod" = "no sweep of a solid"
